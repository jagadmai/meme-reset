<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="text-align:center;font-family:Arial;padding:40px;">
<h1>Hold</h1>
<button onmousedown="s()" onmouseup="e()" ontouchstart="s()" ontouchend="e()">Hold</button>
<p id="t">0.0s</p>
<script>
let i,start;
function s(){ start=Date.now(); i=setInterval(()=>t.innerText=((Date.now()-start)/1000).toFixed(1)+"s",100); }
function e(){ clearInterval(i); }
</script>
</body>
</html>
