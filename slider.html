<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="text-align:center;font-family:Arial;padding:40px;">
<h1>Move it</h1>
<input type="range" min="0" max="100" oninput="t(this.value)">
<p id="out">Nothing.</p>
<script>
function t(v){
  out.innerText = v==0?"Nothing.":v<50?"Almost.":v<100?"Very close.":"You did it.";
}
</script>
</body>
</html>
