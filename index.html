<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Great Meme Reset</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="
  margin:0;
  font-family:'Courier New', monospace;
  background:black;
  color:#22c55e;
  overflow:hidden;
">

  <div id="container" style="
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
  ">

    <h1 style="font-size:46px; letter-spacing:4px;">
      THE GREAT MEME RESET
    </h1>

    <p>The countdown has started.</p>

    <div id="countdown" style="
      font-size:38px;
      letter-spacing:3px;
      margin:25px 0;
      color:#4ade80;
    ">
      00:00:10
    </div>

    <p style="max-width:650px;">
      When the timer reaches zero,<br>
      control is revoked.
    </p>

    <p style="
      position:fixed;
      bottom:15px;
      font-size:12px;
      color:#14532d;
    ">
      THEY ARE ALREADY WATCHING
    </p>

  </div>

  <!-- CHAOS SCRIPT -->
  <script>
    let timeLeft = 10;
    const countdownEl = document.getElementById("countdown");
    const container = document.getElementById("container");

    const glitchTexts = [
      "R3S3T", "RE$ET", "█████", "ERROR",
      "NO ESCAPE", "SYSTEM FAILURE", "CORRUPTED"
    ];

    // Simple beep using Web Audio (no files)
    function beep(freq, duration) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(
        0.00001, ctx.currentTime + duration
      );
      setTimeout(() => { osc.stop(); ctx.close(); }, duration * 1000);
    }

    const timer = setInterval(() => {
      countdownEl.innerHTML =
        "00:00:" + (timeLeft < 10 ? "0" : "") + timeLeft;

      if (timeLeft === 0) {
        clearInterval(timer);
        startChaos();
      }

      timeLeft--;
    }, 1000);

    function startChaos() {
      let flashes = 0;

      const chaos = setInterval(() => {
        // Text corruption
        countdownEl.innerHTML =
          glitchTexts[Math.floor(Math.random() * glitchTexts.length)];

        // Screen shake
        container.style.transform =
          "translate(" + (Math.random()*40-20) + "px," +
                         (Math.random()*40-20) + "px)";

        // Background flicker
        document.body.style.background =
          flashes % 2 === 0 ? "#020617" : "#14532d";

        // Random beeps
        beep(200 + Math.random()*800, 0.1);

        flashes++;

        // End chaos
        if (flashes > 25) {
          clearInterval(chaos);
          container.style.transform = "none";
          document.body.style.background = "black";
          countdownEl.style.color = "#22c55e";
          countdownEl.innerHTML = "THE RESET HAS BEGUN";
        }
      }, 120);
    }
  </script>

</body>
</html>
