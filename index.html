<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Do Not Click</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:white;
">

  <div style="
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
  ">

    <h1 style="font-size:42px;">Welcome.</h1>
    <p style="color:#cbd5f5; max-width:500px;">
      This website contains buttons.<br>
      They do things.
    </p>

    <div style="
      margin-top:30px;
      display:flex;
      flex-direction:column;
      gap:15px;
      width:100%;
      max-width:320px;
    ">

      <button onclick="sayHi()" style="buttonStyle()">Say Hi</button>
      <button onclick="changeBg()" style="buttonStyle()">Change Background</button>
      <button onclick="moveButton(this)" style="buttonStyle()">Catch Me</button>
      <button onclick="rickroll()" style="buttonStyle()">Mystery Button</button>

    </div>

    <p id="msg" style="margin-top:30px; color:#94a3b8;"></p>

  </div>

  <script>
    function buttonStyle() {
      return `
        padding:15px;
        font-size:18px;
        border:none;
        border-radius:14px;
        background:#2563eb;
        color:white;
        cursor:pointer;
      `;
    }

    function sayHi() {
      document.getElementById("msg").innerText = "Hi 👋 thanks for clicking.";
    }

    function changeBg() {
      const colors = ["#020617", "#0f172a", "#1e293b", "#020617"];
      document.body.style.background =
        colors[Math.floor(Math.random() * colors.length)];
    }

    function moveButton(btn) {
      btn.style.position = "relative";
      btn.style.left = Math.random() * 100 - 50 + "px";
      btn.style.top = Math.random() * 60 - 30 + "px";
    }

    function rickroll() {
      window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
    }
  </script>

</body>
</html>
